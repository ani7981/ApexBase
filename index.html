<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fighter Jet Intro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07080f;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ── Page content revealed after animation ──────────────── */
    #page-content {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0c1525 0%, #1a2840 60%, #0c1525 100%);
      color: #e0eaf8;
      z-index: 0;
      opacity: 0;
      animation: revealContent 0.8s ease 0.5s forwards;
    }
    @keyframes revealContent { to { opacity: 1; } }

    #page-content h1 {
      font-size: clamp(2rem, 6vw, 5rem);
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #8ab4ff, #4d9fff, #8ab4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.75rem;
    }
    #page-content p {
      font-size: clamp(1rem, 2vw, 1.4rem);
      letter-spacing: 0.1em;
      color: #5878a0;
    }

    /* ── Transparent overlay for the fighter jet ──────────────── */
    #jet-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    /* Wings span 380/400 = 95% of viewBox.
       At 280vw and start scale 1.25, wingspan is 332vw entering,
       guaranteed to span well past both screen edges.
       Start translateY precisely aligns nose pitot at 100vh (bottom edge). */
    #jet-wrapper {
      width: 280vw;
      flex-shrink: 0;
      transform-origin: center center;
      /* Set initial resting position below screen to prevent any flash on reload */
      transform: translate3d(0, calc(50vh + 273.5vw), 0) scale(1.25);
      will-change: transform, opacity;
      animation: jetFlyAway 1.35s cubic-bezier(0.18, 0.0, 0.52, 1.0) 0.1s both;
    }

    @keyframes jetFlyAway {
      0% {
        transform: translate3d(0, calc(50vh + 273.5vw), 0) scale(1.25);
        opacity: 1;
      }
      80% {
        opacity: 0.95;
      }
      100% {
        transform: translate3d(0, -280vh, 0) scale(0.02);
        opacity: 0;
      }
    }

    /* ── Afterburner flame (sits below nozzle in DOM) ─────────── */
    #ab-wrap {
      position: absolute;
      /* horizontally centred under the SVG */
      left: 50%;
      bottom: 0;
      transform: translateX(-50%) translateY(2%);
      pointer-events: none;
    }
    .ab-inner {
      width: 24px;
      height: 75px;
      border-radius: 45% 45% 55% 55% / 25% 25% 75% 75%;
      background: radial-gradient(ellipse at 50% 12%,
        #fff 0%, #b8e0ff 8%, #40a0ff 28%, #6020e8 62%, transparent 100%);
      filter: blur(2.5px);
      animation: abInner 0.09s ease-in-out infinite alternate;
      margin: 0 auto;
    }
    .ab-outer {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 100px;
      border-radius: 45% 45% 55% 55% / 25% 25% 75% 75%;
      background: radial-gradient(ellipse at 50% 10%,
        rgba(200,160,255,0.35) 0%,
        rgba(90,40,255,0.25) 45%,
        transparent 80%);
      filter: blur(8px);
      animation: abOuter 0.14s ease-in-out infinite alternate;
    }
    @keyframes abInner {
      from { opacity: 0.82; transform: scaleY(1.00); }
      to   { opacity: 1.00; transform: scaleY(1.13); }
    }
    @keyframes abOuter {
      from { opacity: 0.48; transform: translateX(-50%) scaleY(1.00); }
      to   { opacity: 0.90; transform: translateX(-50%) scaleY(1.10); }
    }

    #replay-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      background: rgba(14, 22, 38, 0.7);
      color: #9ab4d0;
      border: 1px solid rgba(100, 160, 255, 0.25);
      border-radius: 20px;
      padding: 7px 16px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      outline: none;
    }
    #replay-btn:hover {
      background: rgba(30, 48, 80, 0.85);
      color: #e0f0ff;
      border-color: rgba(100, 160, 255, 0.5);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

<!-- ── Background website content ─────────────────────────── -->
<div id="page-content">
  <h1>Your Website</h1>
  <p>Replace this with your own content.</p>
</div>

<!-- ── Jet overlay ────────────────────────────────────────── -->
<div id="jet-overlay">
  <div id="jet-wrapper">

    <!-- Afterburner (drawn first so it sits "behind" SVG) -->
    <div id="ab-wrap">
      <div class="ab-outer"></div>
      <div class="ab-inner"></div>
    </div>

    <!--
      ═══════════════════════════════════════════════════════════
        F-16 FIGHTING FALCON — TOP-DOWN VIEW SVG
        ViewBox: 400 wide × 620 tall, centred at (0, -35)
        Nose (pitot) : y = -340
        Nozzle       : y = +268
        Wingspan     : x = ±190  (376 units → ~94% of viewBox)
      ═══════════════════════════════════════════════════════════
    -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="-200 -345 400 625"
      width="100%"
      height="auto"
      style="display:block; overflow:visible;"
      shape-rendering="geometricPrecision"
    >
      <defs>

        <!-- ── FUSELAGE GRADIENT (convex cross-section) ───────── -->
        <linearGradient id="gFuse" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#30343f"/>
          <stop offset="14%"  stop-color="#52586a"/>
          <stop offset="32%"  stop-color="#7e8694"/>
          <stop offset="50%"  stop-color="#b0b8c6"/>  <!-- spine specular -->
          <stop offset="68%"  stop-color="#7e8694"/>
          <stop offset="86%"  stop-color="#52586a"/>
          <stop offset="100%" stop-color="#30343f"/>
        </linearGradient>

        <!-- ── LERX GRADIENT ─────────────────────────────────── -->
        <linearGradient id="gLerx" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#40465a"/>
          <stop offset="50%"  stop-color="#636c7e"/>
          <stop offset="100%" stop-color="#353944"/>
        </linearGradient>
        <linearGradient id="gLerxR" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="#40465a"/>
          <stop offset="50%"  stop-color="#636c7e"/>
          <stop offset="100%" stop-color="#353944"/>
        </linearGradient>

        <!-- ── WING GRADIENT – left (leading→trailing, sweepwise) -->
        <linearGradient id="gWingL" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="#232830"/>  <!-- leading edge shadow -->
          <stop offset="10%"  stop-color="#4a5260"/>  <!-- edge bevel -->
          <stop offset="38%"  stop-color="#6a7280"/>  <!-- upper surface -->
          <stop offset="65%"  stop-color="#7c8490"/>  <!-- mid-panel lighter -->
          <stop offset="88%"  stop-color="#585e6a"/>
          <stop offset="100%" stop-color="#2e3240"/>  <!-- trailing shadow -->
        </linearGradient>
        <!-- ── WING GRADIENT – right ────────────────────────── -->
        <linearGradient id="gWingR" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#232830"/>
          <stop offset="10%"  stop-color="#4a5260"/>
          <stop offset="38%"  stop-color="#6a7280"/>
          <stop offset="65%"  stop-color="#7c8490"/>
          <stop offset="88%"  stop-color="#585e6a"/>
          <stop offset="100%" stop-color="#2e3240"/>
        </linearGradient>

        <!-- ── WING SPECULAR SHEEN ───────────────────────────── -->
        <linearGradient id="gWingShL" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"  stop-color="white" stop-opacity="0"/>
          <stop offset="30%" stop-color="white" stop-opacity="0.065"/>
          <stop offset="50%" stop-color="white" stop-opacity="0.11"/>
          <stop offset="70%" stop-color="white" stop-opacity="0.04"/>
          <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gWingShR" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"  stop-color="white" stop-opacity="0"/>
          <stop offset="30%" stop-color="white" stop-opacity="0.065"/>
          <stop offset="50%" stop-color="white" stop-opacity="0.11"/>
          <stop offset="70%" stop-color="white" stop-opacity="0.04"/>
          <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </linearGradient>

        <!-- ── STABILATOR GRADIENT ───────────────────────────── -->
        <linearGradient id="gStab" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#2c3040"/>
          <stop offset="45%"  stop-color="#5c6270"/>
          <stop offset="100%" stop-color="#22262e"/>
        </linearGradient>
        <linearGradient id="gStabR" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="#2c3040"/>
          <stop offset="45%"  stop-color="#5c6270"/>
          <stop offset="100%" stop-color="#22262e"/>
        </linearGradient>

        <!-- ── FUSELAGE SPINE HIGHLIGHT ──────────────────────── -->
        <linearGradient id="gSpine" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="white" stop-opacity="0"/>
          <stop offset="38%"  stop-color="white" stop-opacity="0.10"/>
          <stop offset="50%"  stop-color="white" stop-opacity="0.22"/>
          <stop offset="62%"  stop-color="white" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </linearGradient>

        <!-- ── CANOPY ─────────────────────────────────────────── -->
        <radialGradient id="gCanopy" cx="38%" cy="28%" r="68%">
          <stop offset="0%"   stop-color="#d8f0ff" stop-opacity="0.96"/>
          <stop offset="22%"  stop-color="#5cb0e0" stop-opacity="0.85"/>
          <stop offset="60%"  stop-color="#1a5080" stop-opacity="0.88"/>
          <stop offset="100%" stop-color="#061828" stop-opacity="0.96"/>
        </radialGradient>

        <!-- ── INTAKE SHADOW ─────────────────────────────────── -->
        <radialGradient id="gIntake" cx="50%" cy="38%" r="62%">
          <stop offset="0%"   stop-color="#1c2030"/>
          <stop offset="45%"  stop-color="#0c0f18"/>
          <stop offset="100%" stop-color="#040610"/>
        </radialGradient>

        <!-- ── NOZZLE ─────────────────────────────────────────── -->
        <radialGradient id="gNozzle" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#fff4c0"/>
          <stop offset="20%"  stop-color="#ff9030"/>
          <stop offset="50%"  stop-color="#6a1a06"/>
          <stop offset="80%"  stop-color="#280a02"/>
          <stop offset="100%" stop-color="#140501"/>
        </radialGradient>



        <!-- ── RADOME GRADIENT ───────────────────────────────── -->
        <linearGradient id="gRadome" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#38404e"/>
          <stop offset="50%"  stop-color="#5e6878"/>
          <stop offset="100%" stop-color="#38404e"/>
        </linearGradient>

        <!-- ── Clip paths to keep specular layers inside shapes ─ -->
        <clipPath id="cpWingL">
          <polygon points="-68,-82 -190,68 -181,86 -17,86 -17,58 -37,58"/>
        </clipPath>
        <clipPath id="cpWingR">
          <polygon points="68,-82 190,68 181,86 17,86 17,58 37,58"/>
        </clipPath>

      </defs>

      <!-- ═══════════════════════════════════════════════════════
           LAYER 1 — HORIZONTAL STABILATORS (drawn first, behind)
           ═══════════════════════════════════════════════════════ -->

      <!-- Left stabilator -->
      <polygon
        points="-20,125  -92,172  -84,204  -16,184"
        fill="url(#gStab)"
      />
      <!-- Leading-edge bevel highlight -->
      <line x1="-20" y1="125" x2="-92" y2="172"
        stroke="#8090a4" stroke-width="0.9" opacity="0.45"/>
      <!-- Panel / spar line -->
      <line x1="-20" y1="125" x2="-16" y2="184"
        stroke="#1e2330" stroke-width="0.45" opacity="0.75"/>
      <!-- Elevon break line -->
      <line x1="-92" y1="172" x2="-16" y2="184"
        stroke="#1a1e2a" stroke-width="0.7" opacity="0.8"/>
      <!-- Elevon surface (slightly darker) -->
      <polygon
        points="-92,172  -84,204  -16,184  -16,181"
        fill="#2a2e38" opacity="0.45"
      />
      <!-- Tip edge -->
      <line x1="-92" y1="172" x2="-84" y2="204"
        stroke="#6a7280" stroke-width="0.8" opacity="0.5"/>

      <!-- Right stabilator -->
      <polygon
        points="20,125  92,172  84,204  16,184"
        fill="url(#gStabR)"
      />
      <line x1="20" y1="125" x2="92" y2="172"
        stroke="#8090a4" stroke-width="0.9" opacity="0.45"/>
      <line x1="20" y1="125" x2="16" y2="184"
        stroke="#1e2330" stroke-width="0.45" opacity="0.75"/>
      <line x1="92" y1="172" x2="16" y2="184"
        stroke="#1a1e2a" stroke-width="0.7" opacity="0.8"/>
      <polygon
        points="92,172  84,204  16,184  16,181"
        fill="#2a2e38" opacity="0.45"
      />
      <line x1="92" y1="172" x2="84" y2="204"
        stroke="#6a7280" stroke-width="0.8" opacity="0.5"/>

      <!-- ═══════════════════════════════════════════════════════
           LAYER 2 — MAIN WINGS
           F-16 cropped-delta planform:
             Leading edge root  : (±68, -82)
             Wing tip (LE)      : (±190, 68)
             Wing tip (TE)      : (±181, 86)
             Inboard TE root    : (±17,  86)
             Inboard TE blend   : (±37,  58) — meets LERX/fuse
           ═══════════════════════════════════════════════════════ -->

      <!-- LEFT wing base fill -->
      <polygon
        points="-68,-82  -190,68  -181,86  -17,86  -17,58  -37,58"
        fill="url(#gWingL)"
      />
      <!-- LEFT wing specular overlay (clipped to wing shape) -->
      <polygon
        points="-68,-82  -190,68  -181,86  -17,86  -17,58  -37,58"
        fill="url(#gWingShL)"
        clip-path="url(#cpWingL)"
      />
      <!-- Leading-edge bevel highlight (sharp metal edge glint) -->
      <line x1="-68" y1="-82" x2="-190" y2="68"
        stroke="#90a0b4" stroke-width="1.1" opacity="0.45" stroke-linecap="round"/>
      <!-- Trailing edge fine line -->
      <line x1="-181" y1="86" x2="-17" y2="86"
        stroke="#1a1e2a" stroke-width="0.7" opacity="0.7"/>
      <!-- Wing root / fuselage boundary -->
      <line x1="-17" y1="58" x2="-37" y2="58"
        stroke="#1a1e2a" stroke-width="0.6" opacity="0.6"/>
      <!-- Tip edge -->
      <line x1="-190" y1="68" x2="-181" y2="86"
        stroke="#788090" stroke-width="0.9" opacity="0.55"/>
      <!-- Spar lines (structural ribs) -->
      <line x1="-68" y1="-82" x2="-37" y2="58"
        stroke="#22272e" stroke-width="0.55" opacity="0.80"/>
      <line x1="-105" y1="-40" x2="-80" y2="78"
        stroke="#22272e" stroke-width="0.45" opacity="0.65"/>
      <line x1="-145" y1="10"  x2="-114" y2="84"
        stroke="#22272e" stroke-width="0.38" opacity="0.55"/>
      <line x1="-170" y1="45"  x2="-150" y2="85"
        stroke="#22272e" stroke-width="0.32" opacity="0.50"/>
      <!-- Aileron break line -->
      <line x1="-155" y1="52" x2="-17" y2="65"
        stroke="#181d26" stroke-width="0.85" opacity="0.88"/>
      <!-- Aileron surface tint (darker) -->
      <polygon
        points="-155,52  -181,86  -17,86  -17,65"
        fill="#252a36" opacity="0.38"
      />
      <!-- Outboard wing texture gradient overlay -->
      <polygon
        points="-68,-82  -190,68  -181,86  -17,86  -17,58  -37,58"
        fill="none" stroke="#1e2330" stroke-width="0.35"
      />

      <!-- RIGHT wing base fill -->
      <polygon
        points="68,-82  190,68  181,86  17,86  17,58  37,58"
        fill="url(#gWingR)"
      />
      <polygon
        points="68,-82  190,68  181,86  17,86  17,58  37,58"
        fill="url(#gWingShR)"
        clip-path="url(#cpWingR)"
      />
      <line x1="68" y1="-82" x2="190" y2="68"
        stroke="#90a0b4" stroke-width="1.1" opacity="0.45" stroke-linecap="round"/>
      <line x1="181" y1="86" x2="17" y2="86"
        stroke="#1a1e2a" stroke-width="0.7" opacity="0.7"/>
      <line x1="17" y1="58" x2="37" y2="58"
        stroke="#1a1e2a" stroke-width="0.6" opacity="0.6"/>
      <line x1="190" y1="68" x2="181" y2="86"
        stroke="#788090" stroke-width="0.9" opacity="0.55"/>
      <line x1="68" y1="-82" x2="37" y2="58"
        stroke="#22272e" stroke-width="0.55" opacity="0.80"/>
      <line x1="105" y1="-40" x2="80" y2="78"
        stroke="#22272e" stroke-width="0.45" opacity="0.65"/>
      <line x1="145" y1="10"  x2="114" y2="84"
        stroke="#22272e" stroke-width="0.38" opacity="0.55"/>
      <line x1="170" y1="45"  x2="150" y2="85"
        stroke="#22272e" stroke-width="0.32" opacity="0.50"/>
      <line x1="155" y1="52" x2="17" y2="65"
        stroke="#181d26" stroke-width="0.85" opacity="0.88"/>
      <polygon
        points="155,52  181,86  17,86  17,65"
        fill="#252a36" opacity="0.38"
      />
      <polygon
        points="68,-82  190,68  181,86  17,86  17,58  37,58"
        fill="none" stroke="#1e2330" stroke-width="0.35"
      />

      <!-- ═══════════════════════════════════════════════════════
           LAYER 3 — WEAPONS / PYLONS
           ═══════════════════════════════════════════════════════ -->

      <!-- Left outboard pylon + AIM-9X Sidewinder -->
      <g transform="rotate(-52, -155, 48)">
        <rect x="-158" y="28" width="5.5" height="36" rx="1.5"
          fill="#282d38" stroke="#141820" stroke-width="0.35"/>
        <!-- missile body -->
        <rect x="-160.5" y="16" width="5" height="42" rx="2.5"
          fill="#22262e" stroke="#12161e" stroke-width="0.35"/>
        <!-- nose cone -->
        <ellipse cx="-158" cy="16" rx="2.5" ry="3" fill="#1a1e28"/>
        <!-- tail fins -->
        <polygon points="-162,50 -155,50 -155,54 -165,57" fill="#1e2230"/>
        <polygon points="-154,50 -161,50 -161,54 -151,57" fill="#1e2230"/>
        <!-- seeker head -->
        <circle cx="-158" cy="15" r="2" fill="#2a3048" stroke="#0e1220" stroke-width="0.3"/>
      </g>

      <!-- Left inboard pylon + AIM-120 AMRAAM -->
      <g transform="rotate(-52, -100, 20)">
        <rect x="-103" y="2" width="5.5" height="40" rx="1.5"
          fill="#282d38" stroke="#141820" stroke-width="0.35"/>
        <rect x="-105.5" y="-12" width="5" height="55" rx="2.5"
          fill="#22262e" stroke="#12161e" stroke-width="0.35"/>
        <ellipse cx="-103" cy="-12" rx="2.5" ry="4" fill="#1a1e28"/>
        <!-- AMRAAM fins -->
        <polygon points="-107,28 -100,28 -100,33 -110,36" fill="#1e2230"/>
        <polygon points="-99,28 -106,28 -106,33 -96,36" fill="#1e2230"/>
      </g>

      <!-- Right outboard pylon + AIM-9X -->
      <g transform="rotate(52, 155, 48)">
        <rect x="152" y="28" width="5.5" height="36" rx="1.5"
          fill="#282d38" stroke="#141820" stroke-width="0.35"/>
        <rect x="155.5" y="16" width="5" height="42" rx="2.5"
          fill="#22262e" stroke="#12161e" stroke-width="0.35"/>
        <ellipse cx="158" cy="16" rx="2.5" ry="3" fill="#1a1e28"/>
        <polygon points="162,50 155,50 155,54 165,57" fill="#1e2230"/>
        <polygon points="154,50 161,50 161,54 151,57" fill="#1e2230"/>
        <circle cx="158" cy="15" r="2" fill="#2a3048" stroke="#0e1220" stroke-width="0.3"/>
      </g>

      <!-- Right inboard pylon + AIM-120 -->
      <g transform="rotate(52, 100, 20)">
        <rect x="97" y="2" width="5.5" height="40" rx="1.5"
          fill="#282d38" stroke="#141820" stroke-width="0.35"/>
        <rect x="100.5" y="-12" width="5" height="55" rx="2.5"
          fill="#22262e" stroke="#12161e" stroke-width="0.35"/>
        <ellipse cx="103" cy="-12" rx="2.5" ry="4" fill="#1a1e28"/>
        <polygon points="107,28 100,28 100,33 110,36" fill="#1e2230"/>
        <polygon points="99,28 106,28 106,33 96,36" fill="#1e2230"/>
      </g>

      <!-- ═══════════════════════════════════════════════════════
           LAYER 4 — MAIN FUSELAGE
           Smooth bezier curves — blended-wing-body F-16 shape
           ═══════════════════════════════════════════════════════ -->
      <path
        id="fuselage"
        d="
          M 0,-338
          C 3,-322  7,-300  8,-278
          C 10,-255  10,-236  10,-216
          C 11,-196  13,-178  16,-160
          C 20,-138  28,-115  34,-92
          C 40,-70   42,-46   41,-22
          C 40,4     36,30    29,58
          C 23,86    19,114   16,142
          C 13,168   10,196   7,222
          C 5,238    2,252    0,262
          C -2,252  -5,238  -7,222
          C -10,196 -13,168 -16,142
          C -19,114 -23,86  -29,58
          C -36,30  -40,4   -41,-22
          C -42,-46 -40,-70 -34,-92
          C -28,-115 -20,-138 -16,-160
          C -13,-178 -11,-196 -10,-216
          C -10,-236 -10,-255 -8,-278
          C -7,-300  -3,-322  0,-338
          Z
        "
        fill="url(#gFuse)"
        stroke="#18191f" stroke-width="0.4"

  <!-- Replay button for testing convenience -->
  <button id="replay-btn" onclick="replayAnimation()">Replay (Space)</button>

  <script>
    function replayAnimation() {
      const wrap = document.getElementById('jet-wrapper');
      const content = document.getElementById('page-content');
      wrap.style.animation = 'none';
      content.style.animation = 'none';
      void wrap.offsetWidth; // trigger reflow
      void content.offsetWidth;
      wrap.style.animation = '';
      content.style.animation = '';
    }
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        replayAnimation();
      }
    });
  </script>
